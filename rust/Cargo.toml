[package]
name = "spacebar_crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
sha3 = "0.10"
blake3 = { version = "1.5", features = ["mmap", "rayon"] }
flutter_rust_bridge = "=2.11.1"

[dev-dependencies]
flutter_rust_bridge_codegen = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
